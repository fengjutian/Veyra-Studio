    <text data-node-id="text:body" style="opacity:1;fill:none;font-family:Inter;font-size:13;stroke:none;" x="56" y="96" dominant-baseline="hanging">这段文字用来验证换行、字重、对齐和字间距在导出里保持一致。</text>
    <g data-node-id="rect:accent" style="opacity:1;fill:var(--color-primary);">  <rect x="56" y="128" width="288" height="48" rx="8" /></g>
  </g>
  <image data-node-id="image:hero" style="opacity:1;fill:none;" x="400" y="40" width="240" height="160" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" preserveAspectRatio="xMidYMid slice" />
  <ellipse data-node-id="ellipse:dot" style="opacity:1;fill:#8b5cf6;stroke:none;" cx="432" cy="272" rx="32" ry="32" />
  <g data-node-id="node:badge" style="opacity:1;fill:#eef2ff;">  <rect x="680" y="40" width="120" height="32" rx="999" />
