<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden — 首页</title>
  <style>
    :root {
      --color-primary: #2563eb;
      --color-surface: #ffffff;
      --spacing-md: 16;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    .design-page { position: relative; overflow: hidden; width: 960px; height: 680px; }
    .design-node { min-width: 0; min-height: 0; }
  </style>
</head>
<body>
  <main class="design-page" data-page-id="page:main">
    <div class="design-node design-frame" data-node-id="frame:card" style="position:absolute;left:40px;top:40px;width:320px;height:fit-content;opacity:1;background:var(--color-surface);border:1px solid #e2e8f0;border-radius:16px;display:flex;flex-direction:column;gap:12px;padding:16px 16px 16px 16px;align-items:stretch;">
      <p class="design-node design-text" data-node-id="text:title" style="position:relative;width:100%;height:fit-content;opacity:1;color:#111111;font-family:&quot;Inter&quot;;font-size:20px;line-height:28px;white-space:pre-wrap;margin:0;font-weight:600;letter-spacing:1px;">设计系统卡片</p>
      <p class="design-node design-text" data-node-id="text:body" style="position:relative;width:100%;height:fit-content;opacity:1;color:#111111;font-family:&quot;Inter&quot;;font-size:13px;line-height:20px;white-space:pre-wrap;margin:0;">这段文字用来验证换行、字重、对齐和字间距在导出里保持一致。</p>
      <div class="design-node design-rectangle" data-node-id="rect:accent" style="position:relative;width:48px;height:48px;opacity:1;background:var(--color-primary);border-radius:8px;"></div>
    </div>
    <img class="design-node design-image" data-node-id="image:hero" style="position:absolute;left:400px;top:40px;width:240px;height:160px;opacity:1;object-fit:cover;" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" alt="主图">
    <div class="design-node design-ellipse" data-node-id="ellipse:dot" style="position:absolute;left:400px;top:240px;width:64px;height:64px;opacity:1;background:#8b5cf6;border-radius:50%;"></div>
    <div class="design-node design-component" data-node-id="node:badge" style="position:absolute;left:680px;top:40px;width:120px;height:32px;opacity:1;background:#eef2ff;border-radius:999px;">
      <p class="design-node design-text" data-node-id="text:badge-label" style="position:absolute;left:0px;top:0px;width:100%;height:fit-content;opacity:1;color:#111111;font-family:&quot;Inter&quot;;font-size:12px;line-height:16px;white-space:pre-wrap;margin:0;text-align:center;">Beta</p>
    </div>
    <div class="design-node design-instance" data-node-id="instance:badge" style="position:absolute;left:680px;top:90px;width:120px;height:32px;opacity:1;background:#eef2ff;border-radius:999px;">
      <p class="design-node design-text" data-node-id="instance:badge--text:badge-label" style="position:absolute;left:0px;top:0px;width:100%;height:fit-content;opacity:1;color:#111111;font-family:&quot;Inter&quot;;font-size:12px;line-height:16px;white-space:pre-wrap;margin:0;text-align:center;">v0.2</p>
    </div>
    <div class="design-node design-frame" data-node-id="frame:hidden" style="position:absolute;left:700px;top:300px;width:100px;height:100px;opacity:1;display:none;"></div>
    <div class="design-node design-vector" data-node-id="vector:logo" style="position:absolute;left:400px;top:340px;width:80px;height:80px;opacity:1;"></div>
  </main>
</body>
</html>
