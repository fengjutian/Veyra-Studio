name: Studio CI

# Studio（独立 AI Design Studio）的构建、测试与性能门禁。
# legacy Vibma 的发布流程在 release.yml，两者不要混用。
#
# 视觉回归单独成 job 且 `continue-on-error`：产物基线绑定本机字体，
# 在 Linux runner 上像素差异来自字体而不是代码，因此只作为参考信号，不阻断合并。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint（eslint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  core:
    name: 核心包 build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:studio-core
      - run: npm run test:studio-core

  web:
    name: 工作台 build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:studio-core
      - run: npm run build:studio-web
      - run: npm run test:studio-web
      # 端到端：版本并排对比。对着构建产物跑——导入 fixture、用真实按键造出第二个
      # 版本、点开两栏、逐点比对两栏内容。纯函数测不出「两栏是不是同一交付物」。
      - run: npm run visual:compare:probe -- --require-browser

  budgets:
    name: 性能预算（layout / export / paint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:studio-core
      # 预算是数量级门禁（5000 节点 12s、绘制 1.6s），不卡毫秒级抖动。
      - run: npm run check:budgets

  a11y:
    name: 可访问性（键盘遍历 / 读屏语义）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:studio-core
      - run: npm run build:studio-web
      # 规则不绑定平台也不绑定字体，所以能当阻断门禁；基线比对不跑——AX 树的细节
      # 会随 Chrome 版本漂移，那是本地 `npm run visual:a11y:check` 的活。
      - run: npm run visual:a11y:check -- --no-baseline --require-browser
      # 整应用走查：对着**构建产物**跑真实界面（顶栏、图层面板、五个检查器分段），
      # 组件级 harness 覆盖不到的交互都在这里。分段栏切换必须用真实鼠标事件，
      # 否则 Radix 收不到 mousedown，五个分段其实查的是同一个界面。
      - run: npm run visual:a11y:app -- --require-browser

  visual:
    name: 视觉回归（参考，不阻断）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:studio-core
      - run: npm run check:visual
      # suite 走 manifest 批量比对多个 fixture，产出 HTML 报告。
      # 与上面同样是参考信号：Linux runner 上的像素差异来自字体而非代码。
      - run: npm run visual:suite:check -- --require-browser
      # 报告即使不阻断也要能看到，否则 CI 失败时还得本地复现一遍。
      - name: 上传视觉 suite 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-suite-report
          path: .artifacts/visual-suite
          if-no-files-found: ignore
